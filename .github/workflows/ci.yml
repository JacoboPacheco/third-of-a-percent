name: ci

# The offline check (scripts/check.py): tests, schema, every stored number recomputed from the raw
# samples, and the page driven in headless Chromium. No compiler is used, nothing is timed, no secrets.
# Manual trigger only for now.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # full history: site/data records the commit that added some files (git log), as on a normal clone
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright numpy pyyaml
          python -m playwright install --with-deps chromium

      - name: scripts/check.py
        run: python scripts/check.py

      - name: Keep the page screenshots when a check fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-screenshots
          path: /tmp/third-site-*
          if-no-files-found: ignore
          retention-days: 7

name: dsweep

# The matrix-multiply d-sweep (dsweep/PLAN.md, fixed before any run): is the cost that FAST adds to the inner loop
# of kernels/k08_matmul.cpp per inner call the same at every matrix size (a fixed cost, H1), proportional to the
# size (a cost per element, H2), or smaller at the larger size (falls)? Each job builds the kernel five ways (the
# no-vectorize build is built by harness/run.py and not timed), times FAST against NONE at the d ladder that the
# runner's cache sizes decide (as compiled and with -falign-loops=64), with a byte-identical A/A at the middle d
# and Cachegrind counts beside the times, and uploads its out/ folder BEFORE any check of the results. A job that
# aborts after its first timing leaves out/dsweep.partial.jsonl. The last job pools every job of a CPU model with
# dsweep/analyze.py (two-level bootstrap, at least 3 jobs per model) and uploads dsweep-pooled.json and a markdown
# table.
#
# Planned runs (PLAN.md): runner=ubuntu-24.04-arm once (6 jobs); runner=ubuntu-24.04 twice (6 jobs each), the two
# x86-64 runs started from the same commit. A run with jobs=[1] is a test of the workflow; a run with reps set is a
# smoke run (the files are marked and refused by the analysis). Neither is ever pooled into a result.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "GitHub-hosted runner label: ubuntu-24.04 (x86-64, the default) or ubuntu-24.04-arm (AArch64, Neoverse-N2). One label per run; results are pooled per CPU model afterwards"
        type: choice
        options: ["ubuntu-24.04", "ubuntu-24.04-arm"]
        default: "ubuntu-24.04"
      jobs:
        description: "matrix job numbers as a JSON list; the planned runs use all six (jobs=[1] is a test of the workflow, never pooled)"
        default: "[1, 2, 3, 4, 5, 6]"
      reps:
        description: "SMOKE RUN ONLY: processes per side instead of the 40 of harness/criteria-v3.json (for example 4, to exercise the whole path in about a minute). Leave empty for a real run; a file made with it is marked as a smoke file and the analysis refuses it"
        default: ""

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(inputs.jobs) }}
    steps:
      # First, before anything else: every result is read against the CPU it got.
      - name: Runner CPU (read every result against this)
        id: cpu
        run: |
          CPU="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')"
          # AArch64 /proc/cpuinfo has no "model name" line; lscpu names the core (the harness reads lscpu too)
          [ -n "$CPU" ] || CPU="$(lscpu | sed -n 's/^Model name: *//p' | head -1)"
          SLUG="$(echo "$CPU" | tr 'A-Z' 'a-z' | sed -E 's/\((r|tm|c)\)//g; s/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
          echo "CPU model: $CPU"
          echo "cores: $(nproc)"
          echo "slug=${SLUG:-unknown-cpu}" >> "$GITHUB_OUTPUT"
          echo "### Job ${{ matrix.job }} runner CPU: $CPU ($(nproc) cores)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install clang-18, libc++-18, valgrind and numpy (Ubuntu noble apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 libc++-18-dev libc++abi-18-dev valgrind python3-numpy
          clang++-18 --version
          valgrind --version
          dpkg-query -W libc++-18-dev libc++abi-18-dev clang-18 valgrind

      - name: Runner facts
        run: |
          lscpu
          nproc
          free -m
          for i in /sys/devices/system/cpu/cpu0/cache/index*; do echo "$i $(cat $i/level) $(cat $i/type) $(cat $i/size)"; done
          python3 dsweep/sweep.py --assume-caches 64,1024

      # Before the 8-minute timing: the rule, the ladder and the file schema run on generated data, with this
      # Python and this numpy. A failure here stops the job before it times anything.
      - name: Offline self-test (generated data, no timing)
        run: |
          sudo apt-get install -y -qq python3-yaml
          python3 tests/test_dsweep.py

      - name: Build, time and collect
        env:
          JOB: ${{ matrix.job }}
          REPS: ${{ inputs.reps }}
        run: |
          ARGS=()
          if [ -n "$REPS" ]; then ARGS+=(--reps "$REPS"); fi
          python3 dsweep/sweep.py --job "$JOB" --out out --build build/dsweep "${ARGS[@]}"

      # Immediately after the sweep and before any check of the results: the folder is the result.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsweep-job-${{ steps.cpu.outputs.slug }}-j${{ matrix.job }}
          path: out/
          if-no-files-found: warn

      - name: Per-job table (informational; one job is not a verdict)
        if: always()
        run: python3 dsweep/analyze.py out | tee -a "$GITHUB_STEP_SUMMARY" || true

  pool:
    needs: sweep
    if: always() && inputs.reps == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install numpy (Ubuntu noble apt)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-numpy

      - name: Download every job's results
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dsweep-job-*
          path: matrix/

      - name: Any results?
        id: have
        run: |
          if ls matrix/*/dsweep.json >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No sweep job produced a dsweep.json; nothing to pool. Jobs that timed something before they stopped are listed below (dsweep.partial.jsonl); see the sweep jobs' logs." | tee -a "$GITHUB_STEP_SUMMARY"
            python3 dsweep/analyze.py matrix | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Pool per CPU model and apply the written rule
        if: steps.have.outputs.found == 'true'
        run: |
          ls matrix
          python3 dsweep/analyze.py matrix --out matrix/dsweep-pooled.json --md matrix/dsweep-pooled.md | tee matrix/report.txt
          { echo '### d-sweep, pooled per CPU model'; echo; cat matrix/dsweep-pooled.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pooled
        if: steps.have.outputs.found == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsweep-pooled
          path: |
            matrix/dsweep-pooled.json
            matrix/dsweep-pooled.md
            matrix/report.txt
          if-no-files-found: warn

name: arm-smoke

on:
  push:
    branches: [arm-smoke]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: |
          uname -a
          lscpu
          nproc
          free -m
          grep -m3 -i "model name\|CPU part\|Features" /proc/cpuinfo || true
          ls /sys/devices/system/cpu/cpu0/cache 2>&1 || true
          for i in /sys/devices/system/cpu/cpu0/cache/index*; do echo "$i $(cat $i/level) $(cat $i/type) $(cat $i/size)"; done 2>&1 || true
          cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq 2>&1 || true
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 libc++-18-dev libc++abi-18-dev valgrind python3-numpy
          clang++-18 --version
          valgrind --version
      - name: Offline tests of the arm64 parsers
        run: |
          sudo apt-get install -y -qq python3-pytest
          python3 -m pytest tests/test_arm64_asm.py tests/test_placement.py tests/test_asm_cachegrind.py -q
      - name: Two kernels, L1
        run: python3 harness/run.py --kernels k02_add_fwd,k04_rev --sizes L1 --programs none --criteria harness/criteria-v3.json --deps build/deps --out out
        continue-on-error: true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-smoke-out
          path: out/
          if-no-files-found: warn
